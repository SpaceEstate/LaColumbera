# Prove automatiche: a ogni push e a ogni pull request esegue tutte le prove di tests/sim (vedi CLAUDE.md, «Come verificare»).
# Nessuna rete verso servizi reali: Redis, Stripe, email, foglio e DeepL sono finti.
# Unico segreto, facoltativo: GAS_SCRIPT = testo dello script Apps Script del foglio (il repository è pubblico, lo script no).
# Se c'è, girano anche le prove di scenarios che lo richiedono; se manca, si saltano come prima. Le altre prove (ui compresa)
# usano sempre lo stub del foglio, per cui sono state scritte: ui.js inserisce da sé le righe del registro e lo vuole vuoto.
# Non tocca il sito né Vercel: serve solo a vedere subito, con la spunta verde o rossa, se una modifica ha rotto qualcosa.
name: Prove

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # fuori dal repository, come in CLAUDE.md: node_modules del sito non serve (nodemailer, stripe e @vercel/blob sono finti)
      - name: Strumenti di prova
        run: npm install --prefix /tmp/testdeps --no-audit --no-fund wasmoon@1.16.0 jsdom@30.1.3

      # testo semplice, oppure compresso (gzip | base64) se supera il limite di 48 KB dei segreti di GitHub
      - name: Script del foglio (dal segreto GAS_SCRIPT, se presente)
        env:
          GAS_SCRIPT: ${{ secrets.GAS_SCRIPT }}
        run: |
          if [ -z "$GAS_SCRIPT" ]; then echo "Segreto GAS_SCRIPT assente: le prove dello script si saltano."; exit 0; fi
          case "$GAS_SCRIPT" in
            H4sI*) printf '%s' "$GAS_SCRIPT" | base64 -d | gunzip > "$RUNNER_TEMP/google-apps-script.gs" ;;
            *) printf '%s\n' "$GAS_SCRIPT" > "$RUNNER_TEMP/google-apps-script.gs" ;;
          esac
          echo "GAS_VERO=$RUNNER_TEMP/google-apps-script.gs" >> "$GITHUB_ENV"
          echo "Script del foglio pronto ($(wc -l < "$RUNNER_TEMP/google-apps-script.gs") righe): le prove che lo richiedono girano."

      - name: Prove tests/sim
        run: |
          set -o pipefail
          esito=0
          for f in scenarios pagamenti preavviso sicurezza messaggi sito istat adempimenti informativa ui; do
            echo "::group::$f"
            gas=""; [ "$f" = scenarios ] && gas="${GAS_VERO:-}"
            LC_GAS_FILE="$gas" NODE_PATH=/tmp/testdeps/node_modules JSDOM_PATH=/tmp/testdeps/node_modules/jsdom node "tests/sim/$f.js" | tee "/tmp/prova-$f.txt" || esito=1
            echo "::endgroup::"
          done
          echo "Riepilogo:"
          for f in scenarios pagamenti preavviso sicurezza messaggi sito istat adempimenti informativa ui; do printf '  %-12s %s\n' "$f" "$(tail -1 "/tmp/prova-$f.txt")"; done
          # senza jsdom ui.js esce con successo saltando tutto: qui deve girare davvero
          if grep -q "prove UI saltate" /tmp/prova-ui.txt; then echo "::error::prove dell'interfaccia saltate (jsdom mancante)"; esito=1; fi
          exit $esito

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Script Lua sulla versione di Redis (Lua 5.1)
        run: |
          pip install lupa==2.8
          node -e "const A=require('./api/_avail.js');require('fs').writeFileSync('/tmp/lua_scripts.json',JSON.stringify({acquire:A.LUA_ACQUIRE,release:A.LUA_RELEASE}))"
          python tests/sim/lua51_check.py | tee /tmp/lua.txt
          grep -q "COMPATIBILE CON LUA 5.1" /tmp/lua.txt
